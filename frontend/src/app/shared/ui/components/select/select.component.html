<div class="mb-4">
  <label
    for="category-select"
    class="section-label block mb-2">
    {{ title }}
  </label>
  <select
    id="category-select"
    (change)="detectChanges($event)"
    class="form-input w-full">
    <option value="all" selected>All</option>
    @for (option of data; track option) {
      <option
        value="{{ option }}"
        >
        {{ option }}
      </option>
    }
  </select>
</div>
