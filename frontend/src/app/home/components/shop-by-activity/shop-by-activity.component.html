<section class="max-w-7xl mx-auto px-4 md:px-6 py-14">
  <div class="text-center mb-8">
    <h2 class="text-3xl md:text-4xl font-black mb-2">Shop Your Workout</h2>
    <p class="text-muted-foreground font-medium">Women / Men — pick your training</p>
  </div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-5">
    @for (activity of activities; track activity) {
      <div
        tabindex="0"
        (click)="goToCategory(activity.category)"
        (keyup.enter)="goToCategory(activity.category)"
        class="group relative overflow-hidden rounded-[1.75rem] aspect-[3/4] cursor-pointer shadow-md hover:shadow-xl transition-shadow">
        <img
          [src]="activity.image"
          [alt]="activity.title"
          loading="lazy"
          class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent"></div>
        <div class="absolute inset-x-0 bottom-0 p-5 text-center">
          <h3 class="text-white text-lg md:text-xl font-black mb-3">{{ activity.title }}</h3>
          <span class="inline-block bg-white/95 text-black text-[11px] font-black uppercase tracking-wider px-5 py-2 rounded-full group-hover:bg-accent group-hover:text-accent-foreground transition-colors">Shop Now</span>
        </div>
      </div>
    }
  </div>
</section>
