<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C547;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A832;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded -->
  <rect width="100" height="100" rx="20" fill="#0A0A0A"/>
  
  <!-- Shopping bag with rounded corners -->
  <g transform="translate(25, 20)">
    <!-- Bag body (rounded bottom) -->
    <path d="M 5 10 L 3 30 Q 3 35 8 35 L 42 35 Q 47 35 47 30 L 45 10 Z" 
          fill="url(#bagGradient)" stroke="none" filter="url(#shadow)"/>
    
    <!-- Bag handles (rounded) -->
    <path d="M 12 10 Q 12 2 22 2 Q 32 2 32 10" 
          fill="none" stroke="url(#bagGradient)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Shopping items inside (rounded) -->
    <circle cx="15" cy="20" r="2.5" fill="#F0D060" opacity="0.8"/>
    <circle cx="25" cy="23" r="2.5" fill="#F0D060" opacity="0.8"/>
    <circle cx="35" cy="20" r="2.5" fill="#F0D060" opacity="0.8"/>
  </g>
  
  <!-- Accent star (rounded) -->
  <g transform="translate(65, 15)">
    <circle cx="8" cy="8" r="10" fill="none" stroke="#E8C547" stroke-width="1.5" opacity="0.3"/>
    <path d="M 8 2 L 10 6.5 L 15 6.5 L 11 9.5 L 13 14 L 8 11 L 3 14 L 5 9.5 L 1 6.5 L 6 6.5 Z" 
          fill="#F0D060" filter="url(#shadow)"/>
  </g>
</svg>
