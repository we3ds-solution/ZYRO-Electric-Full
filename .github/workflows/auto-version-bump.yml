name: Auto Version Bump & Tag

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - main
    paths:
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'docker/Dockerfile'
      - '!**.md'
      - '!docs/**'

jobs:
  bump-version-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.3
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Determine bump type & check skip
        id: bump_analysis
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          # Check if manual dispatch
          IF_MANUAL="${{ github.event.inputs.bump_type }}"
          if [ -n "$IF_MANUAL" ]; then
            echo "bump_type=$IF_MANUAL" >> $GITHUB_OUTPUT
            echo "should_bump=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip if skip requested or non-release commit type
          if [[ "$COMMIT_MSG" =~ \[skip\ ci\] ]] || [[ "$COMMIT_MSG" =~ \[skip\ version\] ]] || [[ "$COMMIT_MSG" =~ ^chore: ]] || [[ "$COMMIT_MSG" =~ ^docs: ]] || [[ "$COMMIT_MSG" =~ ^style: ]] || [[ "$COMMIT_MSG" =~ ^test: ]] || [[ "$COMMIT_MSG" =~ ^refactor: ]]; then
            echo "should_bump=false" >> $GITHUB_OUTPUT
            echo "Skipping version bump for non-release commit."
            exit 0
          fi

          # Determine bump type based on conventional commit keywords
          if [[ "$COMMIT_MSG" =~ BREAKING\ CHANGE ]] || [[ "$COMMIT_MSG" =~ !: ]]; then
            BUMP_TYPE="major"
          elif [[ "$COMMIT_MSG" =~ ^feat: ]] || [[ "$COMMIT_MSG" =~ ^feat\( ]]; then
            BUMP_TYPE="minor"
          elif [[ "$COMMIT_MSG" =~ ^fix: ]] || [[ "$COMMIT_MSG" =~ ^fix\( ]] || [[ "$COMMIT_MSG" =~ ^perf: ]]; then
            BUMP_TYPE="patch"
          else
            echo "should_bump=false" >> $GITHUB_OUTPUT
            echo "Commit message standard does not require automatic release tag."
            exit 0
          fi

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "should_bump=true" >> $GITHUB_OUTPUT

      - name: Get current version
        if: steps.bump_analysis.outputs.should_bump == 'true'
        id: current_version
        run: |
          VERSION=$(grep '"version"' frontend/package.json | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Bump version
        if: steps.bump_analysis.outputs.should_bump == 'true'
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          BUMP="${{ steps.bump_analysis.outputs.bump_type }}"
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version ($BUMP): $NEW_VERSION"

      - name: Update package.json files
        if: steps.bump_analysis.outputs.should_bump == 'true'
        run: |
          npm version --no-git-tag-version ${{ steps.new_version.outputs.version }}
          cd frontend
          npm version --no-git-tag-version ${{ steps.new_version.outputs.version }}
          echo "Updated root and frontend package.json to v${{ steps.new_version.outputs.version }}"

      - name: Commit version bump
        if: steps.bump_analysis.outputs.should_bump == 'true'
        run: |
          git add package.json package-lock.json frontend/package.json frontend/package-lock.json
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.version }} [skip ci]"
          git push origin main

      - name: Create git tag
        if: steps.bump_analysis.outputs.should_bump == 'true'
        run: |
          git tag -a "v${{ steps.new_version.outputs.version }}" -m "Release v${{ steps.new_version.outputs.version }}"
          git push origin "v${{ steps.new_version.outputs.version }}"
